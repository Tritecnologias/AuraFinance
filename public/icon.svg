<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="auraBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#auraBg)" />

  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#312e81" stroke-width="4" stroke-opacity="0.6" />

  <!-- Glowing Emblem Background -->
  <circle cx="256" cy="256" r="148" fill="#6366f1" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Center Stylized Diamond / Hexagon Shield -->
  <path d="M 256 112 L 372 178 L 372 312 L 256 378 L 140 312 L 140 178 Z" fill="url(#auraBrand)" fill-opacity="0.18" stroke="url(#auraBrand)" stroke-width="6" stroke-linejoin="round" />

  <!-- Stylized Geometric "A" Letterform -->
  <path d="M 256 160 L 332 328 L 290 328 L 274 290 L 238 290 L 222 328 L 180 328 Z M 256 226 L 246 256 L 266 256 Z" fill="#ffffff" />

  <!-- Emerald Pulse Accent Dot -->
  <circle cx="340" cy="180" r="18" fill="#10b981" />
  <circle cx="340" cy="180" r="26" fill="#10b981" fill-opacity="0.3" />
</svg>
